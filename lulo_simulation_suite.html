<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Protected page</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f4f6; --card: #ffffff; --ink: #1c1e23; --ink-soft: #5b6068;
    --border: #dcdfe3; --accent: #2f7ab5; --error: #b3372c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --card: #1c1e23; --ink: #e7e9ec; --ink-soft: #9aa0a8; --border: #2c2f35; --accent: #6fb2e0; --error: #e08a7d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 32px 30px; width: 100%; max-width: 340px;
  }
  h1 { font-size: 16px; margin: 0 0 6px; }
  p.hint { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; }
  input[type="password"] {
    width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent; color: var(--ink); margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 10px 12px; font-size: 14px; font-weight: bold; border-radius: 6px;
    border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:active { opacity: 0.85; }
  .error { color: var(--error); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .remember { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-soft); margin: 2px 0 14px; }
  .remember input { width: auto; margin: 0; }
  #card { visibility: hidden; }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Protected page</h1>
    <p class="hint">Enter the password to continue.</p>
    <form id="f" autocomplete="off">
      <input type="password" id="pw" placeholder="Password" autofocus>
      <label class="remember"><input type="checkbox" id="remember" checked> Remember this device</label>
      <button type="submit">Unlock</button>
      <div class="error" id="err"></div>
    </form>
  </div>

const STORAGE_KEY = 'protected_page_key_v1';

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToB64(bytes) {
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function reveal(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  if (doc.title) document.title = doc.title;
  doc.head.querySelectorAll('style').forEach((styleEl) => {
    document.head.appendChild(styleEl.cloneNode(true));
  });
  document.documentElement.replaceChild(doc.body, document.body);
}

async function decryptWithKey(key) {
  const iv = b64ToBytes(PAYLOAD.iv);
  const data = b64ToBytes(PAYLOAD.data);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plainBuf);
}

async function deriveKeyFromPassword(password) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(PAYLOAD.salt);
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: PAYLOAD.iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    true,
    ['decrypt']
  );
}

async function tryStoredKey() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (!stored) return false;
  try {
    const rawKey = b64ToBytes(stored);
    const key = await crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']);
    const html = await decryptWithKey(key);
    reveal(html);
    return true;
  } catch (e) {
    localStorage.removeItem(STORAGE_KEY);
    return false;
  }
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const remember = document.getElementById('remember').checked;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const key = await deriveKeyFromPassword(pw);
    const html = await decryptWithKey(key);
    if (remember) {
      const raw = await crypto.subtle.exportKey('raw', key);
      localStorage.setItem(STORAGE_KEY, bytesToB64(new Uint8Array(raw)));
    }
    reveal(html);
  } catch (e2) {
    err.textContent = 'Incorrect password.';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
});

tryStoredKey().then((ok) => {
  if (!ok) document.getElementById('card').style.visibility = 'visible';
});
</script>
